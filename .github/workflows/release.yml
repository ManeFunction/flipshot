name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/flipshot-venv
          /tmp/flipshot-venv/bin/pip install dist/*.whl
          /tmp/flipshot-venv/bin/flipshot --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing, no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  bump-homebrew-formula:
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: dawidd6/action-homebrew-bump-formula-pr@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: ManeFunction/homebrew-tap
          formula: flipshot
